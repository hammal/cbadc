[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cbadc"
version = "0.4.0"
description = "A toolbox for simulating control-bounded converters."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Hampus Malmberg", email = "hampus.malmberg88@gmail.com" }]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy",
    "scipy",
    "tqdm",
    "typing-extensions",
    "pandas",
    "jinja2",
    "matplotlib",
    "sympy",
    "mpmath",
    "ltspice",
    "deltasigma @ git+https://github.com/hammal/python-deltasigma.git@2a79cc4dee79bbab45f6ceb783eea30c94f11c45",
    "cython",
    "requests",
]

[project.urls]
Homepage = "https://github.com/hammal/cbadc"
"Bug Tracker" = "https://github.com/hammal/cbadc/issues"
Documentation = "https://cbadc.readthedocs.io"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-benchmark",
    "ruff",
    "pre-commit",
]
docs = [
    "sphinx",
    "sphinx_rtd_theme",
    "sphinx-gallery",
    "pygments",
    "rtds_action",
    "myst-parser",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/cbadc"]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    "docs/source",
    "src/cbadc/_circuit/templates",
    "tests/unittest/test_circuit",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",
    "E203",
    "E402",
    "E741",
    "E712",
    "F401",
    "F811",
    "W503",
    "W605",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests/unittest"]
addopts = "--junitxml=pytest-unittests.xml"

[tool.coverage.run]
source = ["src/cbadc"]
