name: Lint

on: workflow_call

jobs:
  check_lint:
    name: "Check lint and formatting"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true

      - name: Set up Python 3.15
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Lint and format check
        run: ./scripts/lint
