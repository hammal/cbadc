name: tutorials

on: workflow_call

# Build the documentation, which executes every tutorial notebook under
# docs/source/tutorials/ at build time. A tutorial whose code no longer matches
# the library raises, fails this job, and is caught in review.
jobs:
  build_tutorials:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-caching: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install docs dependencies
        run: uv sync --extra docs

      - name: Build docs and execute tutorial notebooks
        run: uv run sphinx-build -b html docs/source docs/build/html

      - name: Upload built docs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/build/html
