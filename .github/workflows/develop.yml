name: Tests

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  linting:
    uses: ./.github/workflows/linting.yml
  unittest:
    needs: linting
    uses: ./.github/workflows/unittest.yml
  tutorials:
    needs: linting
    uses: ./.github/workflows/tutorials.yml
  ngspice:
    needs: linting
    uses: ./.github/workflows/ngspice.yml
  container:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: [unittest, tutorials, ngspice]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker_develop.yml
