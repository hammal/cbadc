name: Build and publish releases

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.4.0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: Check release tag
        run: |
          test "$GITHUB_REF_TYPE" = tag
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              raise SystemExit(f"release tag {tag!r} does not match version {version!r}")
          PY

      - name: Build sdist and wheel from it
        run: uv build --no-sources --sdist --wheel --out-dir dist/

      - name: Check distribution metadata
        run: uvx twine check --strict dist/*

      - name: Install both distributions
        run: |
          for artifact in "$GITHUB_WORKSPACE"/dist/*.whl "$GITHUB_WORKSPACE"/dist/*.tar.gz; do
            env_dir="$RUNNER_TEMP/$(basename "$artifact")"
            uv venv --python 3.15 "$env_dir"
            uv pip install --python "$env_dir/bin/python" "$artifact"
            (cd "$RUNNER_TEMP" && EXPECTED_VERSION="${GITHUB_REF_NAME#v}" "$env_dir/bin/python" -c '
          import os
          from importlib.metadata import version
          from cbadc import Frontend

          assert version("cbadc") == os.environ["EXPECTED_VERSION"]
          assert Frontend.leapfrog(N=3, BW=1e6, OSR=10)[0].N == 3
          ')
          done

      - uses: actions/upload-artifact@v7
        with:
          name: cbadc-distributions
          path: dist/*
          if-no-files-found: error

  upload_pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: cbadc-distributions
          path: dist

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
