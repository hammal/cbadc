name: Unit tests

on: workflow_call

jobs:
  test:
    name: "${{ matrix.os }} / Python ${{ matrix.python-version }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          - os: macos-latest
            python-version: "3.15"
          - os: windows-latest
            python-version: "3.15"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
          cache-suffix: ${{ matrix.python-version }}

      - name: Run doctests
        run: ./scripts/test-doctest

      - name: Run unit tests
        run: ./scripts/test-unit

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tests-${{ matrix.os }}-py${{ matrix.python-version }}
          path: pytest-*.xml
